services:
  web:
    build: .
    env_file: .env
    volumes: ["./data:/data"]
    restart: always
  worker:
    build: .
    command: python worker.py
    env_file: .env
    volumes: ["./data:/data"]
    restart: always
  caddy:
    image: caddy:2
    ports: ["80:80","443:443"]
    environment: [DOMAIN]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile","caddy_data:/data"]
    restart: always
volumes:
  caddy_data:
